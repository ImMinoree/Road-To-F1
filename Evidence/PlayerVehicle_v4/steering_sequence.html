<!doctype html><meta charset="utf-8"><title>Actual Unreal steering capture</title><style>body{background:#111;color:white;font:18px sans-serif}img{max-width:100%;max-height:85vh}</style><p>Actual PIE cockpit steering frames; approximately 5 fps. Click image to pause.</p><img id="frame"><script>const frames=["motion_00.png", "motion_02.png", "motion_04.png", "motion_06.png", "motion_08.png", "motion_09.png"];let i=0,playing=true;const img=document.getElementById("frame");img.onclick=()=>playing=!playing;setInterval(()=>{if(playing){img.src=frames[i++%frames.length]}},200);</script>
